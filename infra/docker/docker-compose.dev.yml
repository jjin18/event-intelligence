version: "3.9"
services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    working_dir: /workspace
    ports: ["8000:8000"]
    volumes: ["../../:/workspace"]
    environment: { PYTHONPATH: /workspace }
    env_file: ["../../.env"]
    depends_on: [db, redis]
  db:
    image: postgres:16
    environment: { POSTGRES_USER: user, POSTGRES_PASSWORD: password, POSTGRES_DB: event_intel }
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  postgres_data:
